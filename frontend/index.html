<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Guías Coodescor · gestión de guías y actas de entrega de mercancías" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="color-scheme" content="light dark" />
    <title>Guías Coodescor</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Limpia restos de la PWA anterior: podía servir /login desde caché con
      // la interfaz HTML vieja. La SPA actual no usa service worker.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then((registros) => registros.forEach((registro) => registro.unregister()))
          .catch(() => {});
      }
      if (window.caches) {
        caches.keys()
          .then((claves) => claves.forEach((clave) => caches.delete(clave)))
          .catch(() => {});
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
