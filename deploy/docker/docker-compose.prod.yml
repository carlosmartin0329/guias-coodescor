# docker-compose.prod.yml - Produccion
# Ejecutar desde deploy/docker:  docker compose -f docker-compose.prod.yml up -d --build
version: "3.8"

services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: coodescor-backend
    ports:
      - "8000:8000"
    environment:
      - COODESCOR_DATA_DIR=/data
    volumes:
      - coodescor-data:/data
      - ../../backend/config.json:/app/config.json:ro
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/captcha/nuevo', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
    container_name: coodescor-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  coodescor-data:
    driver: local
