# docker-compose.base44.yml — Base44 dev environment
# Runs the app FROM CLONED SOURCE with live-reload dev servers.
# Backend: Python stdlib HTTP server (no framework hot-reload; restart on change).
# Frontend: Vite dev server with HMR.
services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    environment:
      - COODESCOR_DATA_DIR=/data
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PIP_NO_CACHE_DIR=1
    volumes:
      - ./:/app:ro
      - coodescor-data:/data
    command: ["sh", "-ec", "pip install --quiet -r requirements.txt && exec python run_app.py"]
    ports:
      - "8000:8000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/captcha/nuevo', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: node:20-slim
    working_dir: /app/frontend
    environment:
      - API_PROXY_TARGET=http://backend:8000
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    volumes:
      - ./frontend:/app/frontend
      - frontend-node-modules:/app/frontend/node_modules
    command: ["sh", "-ec", "npm install --silent && exec npx vite --host 0.0.0.0 --port 5173"]
    ports:
      - "3000:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  coodescor-data:
    driver: local
  frontend-node-modules:
    driver: local
