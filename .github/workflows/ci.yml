name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # -------------------------------------------------------------
  # Backend: lint, type-check, tests (carpeta backend/)
  # -------------------------------------------------------------
  backend:
    name: Backend (Python ${{ env.PYTHON_VERSION }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black mypy pytest pytest-cov

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: MyPy (type check)
        run: mypy guias_coodescor --ignore-missing-imports

      - name: Run tests
        run: python -m pytest tests -v --cov=guias_coodescor --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  # -------------------------------------------------------------
  # Frontend: lint, build (carpeta frontend/)
  # -------------------------------------------------------------
  frontend:
    name: Frontend (Node ${{ env.NODE_VERSION }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint src --ext .js,.jsx

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend/dist
          retention-days: 7

  # -------------------------------------------------------------
  # Docker build (solo main). Contexto = raiz del repo.
  # -------------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile.backend
          push: false
          tags: coodescor/backend:${{ github.sha }}
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile.frontend
          push: false
          tags: coodescor/frontend:${{ github.sha }}
          load: true

      - name: Test images start
        run: |
          docker run -d --name backend-test -p 8000:8000 coodescor/backend:${{ github.sha }}
          docker run -d --name frontend-test -p 5173:80 coodescor/frontend:${{ github.sha }}
          sleep 10
          curl -f http://localhost:8000/api/captcha/nuevo
          curl -f http://localhost:5173

  # -------------------------------------------------------------
  # Deploy staging (aprobación manual)
  # -------------------------------------------------------------
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: |
          echo "Deploy to staging server via SSH/Ansible/Terraform"
          # ssh user@staging "cd /opt/coodescor && docker compose -f deploy/docker/docker-compose.prod.yml up -d --build"

  # -------------------------------------------------------------
  # Deploy production (aprobación manual)
  # -------------------------------------------------------------
  deploy-prod:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          echo "Deploy to production server via SSH/Ansible/Terraform"
          # ssh user@prod "cd /opt/coodescor && docker compose -f deploy/docker/docker-compose.prod.yml up -d --build"
