name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # -------------------------------------------------------------
  # Backend: compilación + pruebas (carpeta backend/)
  # -------------------------------------------------------------
  backend:
    name: Backend (Python ${{ env.PYTHON_VERSION }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Compilar (sintaxis)
        run: python -m compileall -q guias_coodescor

      - name: Run tests
        run: python -m pytest tests -q --cov=guias_coodescor --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  # -------------------------------------------------------------
  # Frontend: lint, build (carpeta frontend/)
  # -------------------------------------------------------------
  frontend:
    name: Frontend (Node ${{ env.NODE_VERSION }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # El linter del proyecto es oxlint (ver package.json). Antes el CI
      # invocaba ESLint, que no está instalado ni configurado, y fallaba.
      - name: Lint (oxlint)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend/dist
          retention-days: 7

  # -------------------------------------------------------------
  # Android: informativo. Requiere Android SDK y el wrapper de Gradle;
  # mientras el APK se compile en Android Studio el job no bloquea.
  # -------------------------------------------------------------
  android:
    name: Android (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Compilar APK si hay wrapper de Gradle
        working-directory: ./android_app/CoodescorGuias
        run: |
          if [ -x ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "No hay gradlew: el APK se compila desde Android Studio (ver docs/CAMBIOS_ANDROID.md)."
          fi

  # -------------------------------------------------------------
  # Docker build (solo main). Contexto = raiz del repo.
  # -------------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile.backend
          push: false
          tags: coodescor/backend:${{ github.sha }}
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile.frontend
          push: false
          tags: coodescor/frontend:${{ github.sha }}
          load: true

      - name: Test images start
        run: |
          docker run -d --name backend-test -p 8000:8000 coodescor/backend:${{ github.sha }}
          docker run -d --name frontend-test -p 5173:80 coodescor/frontend:${{ github.sha }}
          sleep 10
          curl -f http://localhost:8000/api/captcha/nuevo
          curl -f http://localhost:5173
