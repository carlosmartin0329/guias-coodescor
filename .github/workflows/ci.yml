name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # -------------------------------------------------------------
  # Backend: lint, type-check, tests
  # -------------------------------------------------------------
  backend:
    name: Backend (Python ${{ env.PYTHON_VERSION }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./guias_coodescor
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy pytest pytest-cov

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: MyPy (type check)
        run: mypy . --ignore-missing-imports

      - name: Run tests
        run: |
          python -m pytest test_sistema.py test_clientes_receptores.py test_db_admin.py test_api_guias.py -v --cov=guias_coodescor --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./guias_coodescor/coverage.xml
          fail_ci_if_error: false

  # -------------------------------------------------------------
  # Frontend: lint, type-check, build
  # -------------------------------------------------------------
  frontend:
    name: Frontend (Node ${{ env.NODE_VERSION }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint 2>/dev/null || npx eslint src --ext .js,.jsx

      - name: TypeScript check (si aplica)
        run: npx tsc --noEmit 2>/dev/null || echo "No TypeScript config, skipping"

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend/dist
          retention-days: 7

  # -------------------------------------------------------------
  # E2E Tests (Playwright) - requiere ambos servicios arriba
  # -------------------------------------------------------------
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      backend:
        image: python:3.11-slim
        ports: ["8000:8000"]
        options: --health-cmd="curl -f http://localhost:8000/api/captcha/nuevo" --health-interval=10s --health-timeout=5s --health-retries=5
        env:
          COODESCOR_DATA_DIR: /tmp/coodescor-data
        run: |
          pip install -q -r requirements.txt 2>/dev/null || true
          python run_app.py
      frontend:
        image: node:20-alpine
        ports: ["5173:5173"]
        options: --health-cmd="curl -f http://localhost:5173" --health-interval=10s --health-timeout=5s --health-retries=5
        run: |
          cd /frontend && npm ci && npm run dev -- --host
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Playwright
        run: |
          cd frontend && npm ci && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          cd frontend && npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          PLAYWRIGHT_API_URL: http://localhost:8000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ./frontend/playwright-report
          retention-days: 7

  # -------------------------------------------------------------
  # Docker build (solo main)
  # -------------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: coodescor/backend:${{ github.sha }}
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./Dockerfile.frontend
          push: false
          tags: coodescor/frontend:${{ github.sha }}
          load: true

      - name: Test images start
        run: |
          docker run -d --name backend-test -p 8000:8000 coodescor/backend:${{ github.sha }}
          docker run -d --name frontend-test -p 5173:5173 coodescor/frontend:${{ github.sha }}
          sleep 10
          curl -f http://localhost:8000/api/captcha/nuevo
          curl -f http://localhost:5173

  # -------------------------------------------------------------
  # Deploy staging (manual approval)
  # -------------------------------------------------------------
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: |
          echo "Deploy to staging server via SSH/Ansible/Terraform"
          # ssh user@staging "cd /opt/coodescor && docker compose pull && docker compose up -d"

  # -------------------------------------------------------------
  # Deploy production (manual approval)
  # -------------------------------------------------------------
  deploy-prod:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          echo "Deploy to production server via SSH/Ansible/Terraform"
          # ssh user@prod "cd /opt/coodescor && docker compose pull && docker compose up -d"